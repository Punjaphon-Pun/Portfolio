<!DOCTYPE html>
<html>
  <head>
    <title>GPU Shadow</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

    <script>
      const renderer = new THREE.WebGLRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true; // ✅ เปิดใช้งานเงา!
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();

      // ✅ กล้อง
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      // camera.position.set(0, 2.5, 7);
      // camera.lookAt(0, 0, 0);

      // --- Objects (3 ชิ้น / สีต่างกัน / ไม่ต้องมีไฟเพราะใช้ MeshBasic) ---
      const clickable = [];
      let pickedObjPosition = new THREE.Vector3(0.0, 0.0, 0.0);
      let cameraPosition = new THREE.Vector3(0.0, 3.0, 8.0);
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0.0, 0.5, 0.0);
      controls.enableDamping = true;

      function addObj(mesh, pos, name) {
        mesh.position.copy(pos);
        mesh.name = name;
        scene.add(mesh);
        clickable.push(mesh);
        return mesh;
      }

      const BoxName = addObj(
        new THREE.Mesh(
          new THREE.BoxGeometry(0.4, 0.4, 0.4),
          new THREE.MeshBasicMaterial({ color: 0xff6b6b })
        ),
        new THREE.Vector3(-4.0, 0.4, 5.5),
        "BoxName"
      );

      const BoxPic = addObj(
        new THREE.Mesh(
          new THREE.BoxGeometry(0.4, 0.4, 0.4),
          new THREE.MeshBasicMaterial({ color: 0x5dff9b })
        ),
        new THREE.Vector3(-3.0, 0.4, 5.5),
        "BoxPic"
      );

      const BoxMap = addObj(
        new THREE.Mesh(
          new THREE.BoxGeometry(0.4, 0.4, 0.4),
          new THREE.MeshBasicMaterial({ color: 0x5db6ff })
        ),
        new THREE.Vector3(-2.0, 0.4, 5.5),
        "BoxMap"
      );

      const BoxCredit = addObj(
        new THREE.Mesh(
          new THREE.BoxGeometry(0.4, 0.4, 0.4),
          new THREE.MeshBasicMaterial({ color: 0xffdd00 })
        ),
        new THREE.Vector3(2.0, 0.4, 5.5),
        "BoxCredit"
      );

      const BoxModel = addObj(
        new THREE.Mesh(
          new THREE.BoxGeometry(0.4, 0.4, 0.4),
          new THREE.MeshBasicMaterial({ color: 0xdd00ff })
        ),
        new THREE.Vector3(3.0, 0.4, 5.5),
        "BoxModel"
      );

      const BoxNameBack = addObj(
        new THREE.Mesh(
          new THREE.BoxGeometry(0.2, 0.2, 0.2),
          new THREE.MeshBasicMaterial({ color: 0xff6b6b })
        ),
        new THREE.Vector3(-6.0, 3.0, -3.0),
        "BoxNameBack"
      );

      const BoxPicBack = addObj(
        new THREE.Mesh(
          new THREE.BoxGeometry(0.2, 0.2, 0.2),
          new THREE.MeshBasicMaterial({ color: 0x5dff9b })
        ),
        new THREE.Vector3(0.0, 1.0, -3.0),
        "BoxPicBack"
      );

      const BoxMapBack = addObj(
        new THREE.Mesh(
          new THREE.BoxGeometry(0.2, 0.2, 0.2),
          new THREE.MeshBasicMaterial({ color: 0x5db6ff })
        ),
        new THREE.Vector3(6.0, 3.0, -3.0),
        "BoxMapBack"
      );

      const BoxCreditBack = addObj(
        new THREE.Mesh(
          new THREE.BoxGeometry(0.2, 0.2, 0.2),
          new THREE.MeshBasicMaterial({ color: 0xffdd00 })
        ),
        new THREE.Vector3(6.0, 3.0, 3.0),
        "BoxCreditBack"
      );

      const BoxModelBack = addObj(
        new THREE.Mesh(
          new THREE.BoxGeometry(0.2, 0.2, 0.2),
          new THREE.MeshBasicMaterial({ color: 0xdd00ff })
        ),
        new THREE.Vector3(-3.0, 0.5, -0.5),
        "BoxModelBack"
      );

      // --- พรีเซ็ตตำแหน่งกล้องต่อวัตถุ (กำหนดง่าย ๆ) ---
      const VIEWS = {
        BoxName: {
          pos: new THREE.Vector3(-4.0, 2.0, -0.5),
          tar: new THREE.Vector3(-4.0, 5.0, -20.0),
        },
        BoxPic: {
          pos: new THREE.Vector3(0.0, 2.0, 0.0),
          tar: new THREE.Vector3(0.0, 2.0, -0.5),
        },
        BoxMap: {
          pos: new THREE.Vector3(4.0, 2.0, -0.5),
          tar: new THREE.Vector3(4.0, 5.0, -20.0),
        },
        BoxCredit: {
          pos: new THREE.Vector3(4.0, 2.0, 0.5),
          tar: new THREE.Vector3(20.0, 2.0, 1.0),
        },
        BoxModel: {
          pos: new THREE.Vector3(-1.0, 1.0, -1.0),
          tar: new THREE.Vector3(-5.0, 2.0, 4.0),
        },
        BoxNameBack: {
          pos: new THREE.Vector3(0.0, 3.0, 8.0),
          tar: new THREE.Vector3(0.0, 0.0, 0.0),
        },
        BoxPicBack: {
          pos: new THREE.Vector3(0.0, 3.0, 8.0),
          tar: new THREE.Vector3(0.0, 0.0, 0.0),
        },
        BoxMapBack: {
          pos: new THREE.Vector3(0.0, 3.0, 8.0),
          tar: new THREE.Vector3(0.0, 0.0, 0.0),
        },
        BoxCreditBack: {
          pos: new THREE.Vector3(0.0, 3.0, 8.0),
          tar: new THREE.Vector3(0.0, 0.0, 0.0),
        },
        BoxModelBack: {
          pos: new THREE.Vector3(0.0, 3.0, 8.0),
          tar: new THREE.Vector3(0.0, 0.0, 0.0),
        },
      };

      // --- Raycaster + คลิกเพื่อสลับมุม ---
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      function setPointer(e) {
        const r = renderer.domElement.getBoundingClientRect();
        const x = (e.clientX ?? e.touches[0].clientX) - r.left;
        const y = (e.clientY ?? e.touches[0].clientY) - r.top;
        pointer.x = (x / r.width) * 2 - 1;
        pointer.y = -(y / r.height) * 2 + 1;
      }

      function onPick(e) {
        setPointer(e);
        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.intersectObjects(clickable, false)[0];
        if (!hit) return;
        const view = VIEWS[hit.object.name];
        cameraPosition = view.pos;
        pickedObjPosition = view.tar;
        // pickedObjPosition = hit.object.position;
        if (!view) return;

        // ย้ายแบบทันที (ถ้าอยากนุ่ม ๆ ค่อยเสริม lerp ทีหลัง)
        // camera.position.copy(view.pos);
        // controls.target.copy(view.tar);
        controls.update();
      }

      renderer.domElement.addEventListener("click", onPick);
      renderer.domElement.addEventListener(
        "touchend",
        (e) => {
          onPick(e);
        },
        { passive: true }
      );

      // --- Resize ---
      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      function lerp(a, b, t) {
        return a + (b - a) * t; // t ใน [0..1]
      }

      let t = 0.0;
      let cylinderTarget = new THREE.Vector3();

      // ✅ Ambient Light
      const ambientLight = new THREE.AmbientLight(0x404040);
      scene.add(ambientLight);

      // ✅ Directional Light
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.2);
      directionalLight.position.set(5, 10, 5);
      directionalLight.castShadow = true;
      scene.add(directionalLight);

      // ✅ Point Light
      const pointLight = new THREE.PointLight(0xffffff, 5, 5);
      pointLight.position.set(0.0, 4.0, -3.5);
      pointLight.castShadow = true;
      scene.add(pointLight);

      // ✅ Point Light
      const pointLight2 = new THREE.PointLight(0xffff00, 2.5, 5.0);
      pointLight2.position.set(0.0, 4.0, 5.5);
      pointLight2.castShadow = true;
      scene.add(pointLight2);

      // ใส่พื้น
      const texFloor = new THREE.TextureLoader().load(
        "https://Punjaphon-Pun.github.io/grass-floor-pokemon.jpg",
        (t) => {
          t.wrapS = THREE.RepeatWrapping;
          t.wrapT = THREE.RepeatWrapping;
        }
      );
      const matFloor = new THREE.MeshStandardMaterial({
        map: texFloor,
      });
      const planeGeometry = new THREE.PlaneGeometry(18, 12);
      const plane = new THREE.Mesh(planeGeometry, matFloor);
      plane.position.set(0.0, -0.01, 0.0);
      plane.rotation.x = -Math.PI / 2;
      plane.receiveShadow = true;
      scene.add(plane);

      // // พื้นหลัง
      const exrLoader = new THREE.EXRLoader();
      exrLoader.load(
        "https://Punjaphon-Pun.github.io/satara_night_1k.exr",
        function (texture) {
          texture.mapping = THREE.EquirectangularReflectionMapping;
          scene.background = texture; // ทำเป็นพื้นหลัง
          scene.environment = texture; // ทำเป็น reflection
        }
      );

      // Pokemon Center
      const loader = new THREE.GLTFLoader();
      loader.load(
        "https://Punjaphon-Pun.github.io/pokemon_center_insite.glb",
        function (gltf) {
          const object = gltf.scene;
          object.castShadow = true; // ✅ วัตถุนี้สร้างเงา

          // ตั้งค่า castShadow กับทุก mesh ใน object
          object.traverse(function (child) {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });
          scene.add(object);
        },
        undefined,
        function (error) {
          console.error("Error loading OBJ:", error);
        }
      );

      // magnet
      loader.load(
        "https://Punjaphon-Pun.github.io/magnet.glb",
        function (gltf) {
          const object = gltf.scene;
          object.castShadow = true; // ✅ วัตถุนี้สร้างเงา
          // ตั้งค่า castShadow กับทุก mesh ใน object
          object.traverse(function (child) {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });
          scene.add(object);
        },
        undefined,
        function (error) {
          console.error("Error loading OBJ:", error);
        }
      );

      // Honedge
      loader.load(
        "https://Punjaphon-Pun.github.io/Honedge.glb",
        function (gltf) {
          const object = gltf.scene;
          object.castShadow = true; // ✅ วัตถุนี้สร้างเงา
          // ตั้งค่า castShadow กับทุก mesh ใน object
          object.traverse(function (child) {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });
          object.position.set(-0.75, 0.0, 0.0);
          scene.add(object);
        },
        undefined,
        function (error) {
          console.error("Error loading OBJ:", error);
        }
      );

      // cell shader
      const groudonUniforms = {
        uTime: { value: 0.0 },
        uLightDir: { value: new THREE.Vector3(0.4, 1.0, 0.8).normalize() },
      };

      const groudonVert = `
uniform float uTime;
varying vec3 vNormal;
varying vec3 vPosW;
varying vec2 vUv;

void main(){
  vNormal = normalize(mat3(modelMatrix) * normal);
  vec3 pos = position;
  vUv = uv;
  vPosW = (modelMatrix * vec4(pos, 1.0)).xyz;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
}
`;

      const groudonFrag = `
precision mediump float;
varying vec3 vNormal;
uniform vec3 uLightDir;
varying vec3 vPosW;
varying vec2 vUv;
uniform sampler2D uTex;

void main(){
  float diffuse = clamp(dot(vNormal, uLightDir), 0.3, 1.0);
  float levels = 3.0;
  diffuse = floor(diffuse * levels) / levels;
  diffuse += 0.5;

  vec3 R = reflect(-uLightDir, vNormal);
  vec3 V = normalize(cameraPosition - vPosW);
  float specular = max(pow(dot(R, V), 8.0), 0.0);
  specular = smoothstep(0.4, 0.6, specular);

  if(diffuse <= 0.5)
    specular = 0.0;

  vec3 base = texture2D(uTex, vUv).rgb;
  vec3 color = (base * diffuse) + vec3(specular);

  gl_FragColor = vec4(color, 1.0);
}
`;
      // Groudon
      loader.load(
        "https://Punjaphon-Pun.github.io/Groudon.glb",
        function (gltf) {
          const object = gltf.scene;

          object.traverse((child) => {
            if (child.isMesh && child.material.map) {
              const tex = child.material.map;

              child.material = new THREE.ShaderMaterial({
                vertexShader: groudonVert,
                fragmentShader: groudonFrag,
                uniforms: {
                  uTime: groudonUniforms.uTime,
                  uLightDir: groudonUniforms.uLightDir,
                  uTex: { value: tex },
                },
              });
            }
          });

          object.position.set(0.0, 0.2, 0.0);
          scene.add(object);
        },
        undefined,
        function (error) {
          console.error("Error loading Groudon:", error);
        }
      );

      // Picture
      loader.load(
        "https://Punjaphon-Pun.github.io/picture_me.glb",
        function (gltf) {
          const object = gltf.scene;
          object.castShadow = true; // ✅ วัตถุนี้สร้างเงา
          // ตั้งค่า castShadow กับทุก mesh ใน object
          object.traverse(function (child) {
            if (child.isMesh) {
              //child.castShadow = true;
              child.receiveShadow = true;
            }
          });
          scene.add(object);
        },
        undefined,
        function (error) {
          console.error("Error loading OBJ:", error);
        }
      );

      // Name
      loader.load(
        "https://Punjaphon-Pun.github.io/MyName.glb",
        function (gltf) {
          const object = gltf.scene;
          object.castShadow = true; // ✅ วัตถุนี้สร้างเงา
          // ตั้งค่า castShadow กับทุก mesh ใน object
          object.traverse(function (child) {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });
          scene.add(object);
        },
        undefined,
        function (error) {
          console.error("Error loading OBJ:", error);
        }
      );

      // Credit
      loader.load(
        "https://Punjaphon-Pun.github.io/Credit.glb",
        function (gltf) {
          const object = gltf.scene;
          object.castShadow = true; // ✅ วัตถุนี้สร้างเงา
          // ตั้งค่า castShadow กับทุก mesh ใน object
          object.traverse(function (child) {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });
          scene.add(object);
        },
        undefined,
        function (error) {
          console.error("Error loading OBJ:", error);
        }
      );

      // Sign
      loader.load(
        "https://Punjaphon-Pun.github.io/sign.glb",
        function (gltf) {
          const object = gltf.scene;
          object.castShadow = true; // ✅ วัตถุนี้สร้างเงา
          // ตั้งค่า castShadow กับทุก mesh ใน object
          object.traverse(function (child) {
            if (child.isMesh) {
              //child.castShadow = true;
              child.receiveShadow = true;
            }
          });
          object.position.set(-1.0, 1.25, 2.0);
          object.rotation.y = Math.PI / 8;
          object.scale.set(0.5, 0.5, 0.5);
          scene.add(object);
        },
        undefined,
        function (error) {
          console.error("Error loading OBJ:", error);
        }
      );
    // vertex shader
    const uniforms = { 
    uTime: { value: 0.0 } ,
    uHeight: { value: null } // texture ที่จะโหลดมา
  };
  // ---- Shaders (sample texture ใน vertex แล้วดัน pos.z) ----
  const vert = `
    uniform sampler2D uHeight;
    uniform float uTime;

    varying float vH;

    void main(){
      vec3 pos = position;
      float h = texture2D(uHeight, uv).r * (sin(uTime)+1.0); 
      pos.z = pos.z + (h * 0.5);
      vH = h;                             
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `;
  const frag = `
    precision mediump float;
    varying float vH;
    void main(){
      // ระบายสีตามความสูง: ดำ→น้ำเงิน→ฟ้า
      gl_FragColor = vec4(vH, 0.0-vH, 1.0, 1.0);
    }
  `;

  // โหลด texture แล้วค่อยสร้าง geometry/material ให้สัดส่วนตรงกับรูป
  new THREE.TextureLoader().load('https://www.shutterstock.com/shutterstock/videos/3608118583/thumb/10.jpg?ip=x480', (tex) => {

    uniforms.uHeight.value = tex;
    const geo = new THREE.PlaneBufferGeometry(2.5, 1.5, 50, 50);
    const mat = new THREE.ShaderMaterial({
      vertexShader: vert,
      fragmentShader: frag,
      uniforms: uniforms,
      //wireframe: true, // เปิดถ้าอยากดูเส้นตาราง
      side: THREE.DoubleSide
       
    });

    const mesh = new THREE.Mesh(geo, mat);
    scene.add(mesh);
    mesh.position.set(3.9, 1.725, -4.12);
  });
  // Resize & Render loop
  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  (function loop(){
    uniforms.uTime.value += 0.02;
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  })();

      // ✅ render loop
      function animate(t) {
        controls.update();
        controls.target.lerp(pickedObjPosition, 0.02);
        camera.position.lerp(cameraPosition, 0.02);

        // อัปเดตเวลาและทิศทางแสงของ Groudon
        if (groudonUniforms) {
          groudonUniforms.uTime.value = performance.now() / 1000;
          groudonUniforms.uLightDir.value
            .set(Math.sin(groudonUniforms.uTime.value), 1.0, 0.8)
            .normalize();
        }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      animate(0);

      window.addEventListener("mousemove", (event) => {
        // นำตำแหน่งเมาส์ (0..window.innerWidth, 0..window.innerHeight)
        // มา normalize เป็นช่วง -1 ถึง 1
        // const x = (event.clientX / window.innerWidth) * 2 - 1;
        // const y = -(event.clientY / window.innerHeight) * 2 + 1;
        // // ปรับตำแหน่ง pointLight ให้สัมพันธ์กับการขยับเมาส์
        // directionalLight.position.x = x * 5; // คูณเพื่อกำหนดระยะเลื่อน
        // directionalLight.position.y = y * 5;
      });
    </script>
  </body>
</html>
